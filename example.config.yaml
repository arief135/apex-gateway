gateway:
  addr: ":8080"
  tls_addr: ":8443"
  tls_cert_file: ""   # set to enable HTTPS
  tls_key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576   # 1MB
  route_config_ttl: 30s       # how often to reload routes from DB

admin:
  addr: ":9090"
  jwt_secret: "change-me-in-production"  # override via GATEWAY_JWT_SECRET env var

postgres:
  dsn: "postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

kafka:
  brokers:
    - "localhost:9092"
  topic: "gateway.traffic"
  enabled: false   # set to true when Kafka is available

log:
  level: "info"     # debug | info | warn | error
  format: "json"    # json | console
